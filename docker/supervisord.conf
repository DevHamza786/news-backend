[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Runs the one scheduled command (news:fetch-rss, everyMinute()) in-process.
# Originally planned as a separate Railway cron-triggered service (zero idle
# cost) instead of a permanent process, but the Railway CLI doesn't expose a
# way to set a per-service cron schedule / custom start command from a
# locally-uploaded source (no `railway service` subcommand for it, and
# railway.json's config-as-code isn't picked up by `railway up` in this
# project — confirmed while debugging the build itself). A single
# `schedule:work` loop for one lightweight command is a small, predictable
# cost (~20-30MB) — nowhere near the worker-sprawl pattern this deploy is
# built to avoid — so it's the pragmatic fallback here.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
